<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=  , initial-scale=1.0">
    <title>practice of css </title>
    <link rel="stylesheet" href="p2.css">
    <style>
        .container{
            display: flex;
        }
        .container div{
            border: 2px solid tomato;
            height: 50px;
            width: 200px;
            font-size: 3em;
            text-align: center;
        }
        .box_2 div{
            gap: 50px;
        }
        .box_2{
            font-size: 2em;
            border: 2px solid darkred;
            gap: 50px;
            height: 100px;
            width: 100px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
    </div>
    <div class="box-container">
        <div class="box">1</div>
        <div class="box">1</div>
        <div class="box">1</div>
        <div class="box">1</div>
        <div class="box">1</div>
        <div class="box">1</div>
    </div>
    <div class="box-2">
        <div class="box_2">1</div>
        <div class="box_2">2</div>
        <div class="box_2">3</div>
        <div class="box_2">4</div>
        <div class="box_2">5</div>
        <div class="box_2">6</div>
        <div class="box_2">7</div>
        <div class="box_2">8</div>
        <div class="box_2">9</div>
        <!-- <div class="box_2">10</div> -->
    </div>
</body>
</html>
